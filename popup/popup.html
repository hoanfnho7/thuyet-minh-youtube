<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YouTube AI Voice Dubber</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      padding: 14px;
      background: #0f1420;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      line-height: 1.45;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 6px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    h1 { font-size: 14px; font-weight: 700; }
    .sub { color: #94a3b8; font-size: 11.5px; margin-bottom: 12px; }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 11.5px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    label {
      display: block;
      font-size: 11.5px;
      color: #cbd5e1;
      margin-bottom: 3px;
    }
    input[type="password"] {
      width: 100%;
      padding: 6px 8px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #1e293b;
      color: #fff;
      font-size: 12px;
      margin-bottom: 8px;
      outline: none;
    }
    input[type="password"]:focus { border-color: #38bdf8; }
    .hint { font-size: 11px; color: #94a3b8; margin-bottom: 8px; }
    button {
      width: 100%;
      padding: 7px 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #3b82f6; }
    .saved {
      text-align: center;
      color: #34d399;
      font-size: 11.5px;
      font-weight: 600;
      margin-top: 6px;
      min-height: 16px;
    }
    .shortcut-row {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    .shortcut-row:last-child { margin-bottom: 0; }
    kbd {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 10.5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
      </svg>
    </div>
    <h1>YouTube AI Voice Dubber</h1>
  </div>
  <p class="sub" data-i18n="popupSubtitle">Real-time AI voice-over &amp; bilingual karaoke for YouTube</p>

  <div class="card">
    <div class="card-title" data-i18n="popupByokTitle">Optional API Keys (BYOK)</div>
    <label for="openaiKey" data-i18n="popupOpenaiLabel">OpenAI API Key (Nova Voice)</label>
    <input type="password" id="openaiKey" placeholder="sk-..." autocomplete="off" />

    <label for="googleKey" data-i18n="popupGoogleLabel">Google Cloud API Key (WaveNet)</label>
    <input type="password" id="googleKey" placeholder="AIza..." autocomplete="off" />

    <p class="hint" data-i18n="popupByokHint">Leave blank to use built-in free Neural &amp; Google voices.</p>
    <button id="saveBtn" data-i18n="popupSaveBtn">Save Settings</button>
    <div class="saved" id="savedStatus"></div>
  </div>

  <div class="card">
    <div class="shortcut-row">
      <span data-i18n="popupShortcutDub">Toggle Dubbing</span>
      <kbd>Alt + Shift + D</kbd>
    </div>
    <div class="shortcut-row">
      <span data-i18n="popupShortcutScript">Toggle Bilingual Script</span>
      <kbd>Alt + Shift + V</kbd>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
